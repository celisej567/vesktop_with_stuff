patchedDependencies:
  electron-updater: patches/electron-updater.patch
nodeLinker: hoisted
allowBuilds:
  "@vencord/venmic": true
  electron: true
  electron-winstaller: false
  esbuild: true
pmOnFail: warn
verifyDepsBeforeRun: warn
recursiveInstall: false
packages:
  - packages/*
  # built by scripts/build/build.mts with its own toolchain (CMake), not a pnpm package of the app
  - "!packages/vesktop_media"
minimumReleaseAgeExclude:
  - electron
  - '@vencord/*'
